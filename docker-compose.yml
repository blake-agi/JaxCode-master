services:
  jaxcode:
    image: jaxcode:latest
    build: .
    user: root
    ports:
      - "8888:8888"
    environment:
      - PORT=8888
    volumes:
      - ./notebooks:/app/notebooks
      # Mounted so edits to the judge show up without rebuilding the image.
      - ./jax_judge:/app/jax_judge
      - ./data:/app/data
    restart: unless-stopped
